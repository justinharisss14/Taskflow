
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>TaskFlow</h1>
      <p>Organize your day, one task at a time.</p>
    </header>

    <form id="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="What do you need to do?"
        autocomplete="off"
      >
      <button type="submit">Add Task</button>
    </form>

    <section class="summary">
      <p>Total tasks: <span id="total-count">0</span></p>
      <p>Completed: <span id="completed-count">0</span></p>
    </section>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </nav>

    <ul id="task-list"></ul>
    <p id="empty-message">No tasks yet. Add your first task!</p>
  </main>
</body>
</html>
